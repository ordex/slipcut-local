server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Every module is served with a .js extension, which the default map covers.
    # That is deliberate: .mjs is missing from the default map of more than one
    # static host, and a module served as the wrong type is refused.
    include /etc/nginx/mime.types;

    # There is no bundler, so no filenames carry a content hash: nothing may be
    # cached long-term, or a deployment would never reach anybody. Revalidation
    # is cheap — these are small files and 304s cost almost nothing.
    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-cache";
    }

    # The vendored libraries are pinned by version and checksum and only change
    # when the vendoring script is rerun, so they may be revalidated less eagerly.
    location /vendor/ {
        try_files $uri =404;
        access_log off;
        add_header Cache-Control "no-cache";
    }

    # A service worker that outlives its deployment cannot be replaced.
    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # The app never talks to a server after loading, so nothing needs to be
    # reachable from it: this is a policy the deployment can actually enforce.
    add_header Content-Security-Policy "default-src 'none'; script-src 'self'; worker-src 'self' blob:; style-src 'self'; img-src 'self' data:; connect-src 'self'; manifest-src 'self'; form-action 'none'; base-uri 'none'; frame-ancestors 'none'" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;

    gzip on;
    gzip_types application/javascript text/css text/plain application/json application/manifest+json image/svg+xml;
    gzip_min_length 1024;
}
